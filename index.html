<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>点不到我 😜</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    font-family: "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  h1 {
    color: #fff;
    font-size: 2rem;
    text-shadow: 2px 2px 8px rgba(0,0,0,.3);
    margin-bottom: 20px;
    text-align: center;
  }
  #score {
    color: #ffe066;
    font-size: 1.4rem;
    margin-bottom: 30px;
    font-weight: bold;
  }
  #btn {
    position: absolute;
    padding: 18px 40px;
    font-size: 1.3rem;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(245,87,108,.5);
    transition: top .18s ease, left .18s ease, transform .1s;
    white-space: nowrap;
  }
  #btn:active { transform: scale(.95); }
  #win {
    display: none;
    color: #fff;
    font-size: 2rem;
    text-align: center;
    animation: pop .5s ease;
  }
  @keyframes pop {
    0% { transform: scale(0); }
    80% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>

<h1>你能点到我吗？😜</h1>
<div id="score">成功点中：0 次</div>
<div id="win"></div>
<button id="btn">来点我呀～</button>

<script>
  const btn = document.getElementById('btn');
  const scoreEl = document.getElementById('score');
  const winEl = document.getElementById('win');
  let score = 0;
  const GOAL = 5; // 点中 5 次就赢

  function moveBtn() {
    const pad = 10;
    const maxX = window.innerWidth - btn.offsetWidth - pad;
    const maxY = window.innerHeight - btn.offsetHeight - pad;
    const x = Math.random() * maxX + pad;
    const y = Math.random() * maxY + pad;
    btn.style.left = x + 'px';
    btn.style.top = y + 'px';
  }

  // 鼠标靠近就跑（桌面端）
  btn.addEventListener('mouseover', moveBtn);

  // 点击算你赢一次，然后继续跑
  btn.addEventListener('click', () => {
    score++;
    scoreEl.textContent = `成功点中：${score} 次`;
    if (score >= GOAL) {
      btn.style.display = 'none';
      winEl.style.display = 'block';
      winEl.innerHTML = `🎉 厉害！你点中了我 ${GOAL} 次！<br><br>刷新页面再来一局～`;
      return;
    }
    moveBtn();
  });

  // 手机端：点之前先随机挪一下（触摸屏没有 hover）
  btn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    moveBtn();
  }, { passive: false });

  // 初始化位置
  window.onload = moveBtn;
  window.onresize = moveBtn;
</script>

</body>
</html>
